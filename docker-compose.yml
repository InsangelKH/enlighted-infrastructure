version: '3.9'
name: enlighted-infrastructure

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enlighted
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-app_admin_dev_password}
      APP_READWRITE_PASSWORD: ${APP_READWRITE_PASSWORD:-app_readwrite_dev_password}
      APP_READONLY_PASSWORD: ${APP_READONLY_PASSWORD:-app_readonly_dev_password}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: ../enlighted-migrations
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app_admin:${APP_ADMIN_PASSWORD:-app_admin_dev_password}@db:5432/enlighted?sslmode=disable
      MIGRATIONS_PATH: '/app/migrations'
      SEED_PATH: '/app/seed/seed.sql'

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Dev convenience only: orders.events/payments.events get created on first publish
      # instead of needing a provisioning step. Revisit before anything resembling prod.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  products:
    build:
      context: ../enlighted-products
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      PORT: '9090'
      # app_readwrite, not app_readonly: this service now writes stock/stock_reservations.
      DATABASE_URL: postgres://app_readwrite:${APP_READWRITE_PASSWORD:-app_readwrite_dev_password}@db:5432/enlighted?sslmode=disable
    command: ["/app/bin/server"]

  orders:
    build:
      context: ../enlighted-orders
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      PORT: '9092'
      DATABASE_URL: postgres://app_readwrite:${APP_READWRITE_PASSWORD:-app_readwrite_dev_password}@db:5432/enlighted?sslmode=disable
    command: ["/app/bin/server"]

  payments:
    build:
      context: ../enlighted-payments
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      PORT: '9093'
      DATABASE_URL: postgres://app_readwrite:${APP_READWRITE_PASSWORD:-app_readwrite_dev_password}@db:5432/enlighted?sslmode=disable
    command: ["/app/bin/server"]

  users:
    build:
      context: ../enlighted-users
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      PORT: '9091'
      DATABASE_URL: postgres://app_readwrite:${APP_READWRITE_PASSWORD:-app_readwrite_dev_password}@db:5432/enlighted?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      PRODUCTS_SERVICE_ADDR: 'products:9090'
    command: ["/app/bin/server"]

  app:
    build:
      context: ../enlighted-api
    depends_on:
      products:
        condition: service_started
      users:
        condition: service_started
    environment:
      PORT: '8000'
      PRODUCTS_SERVICE_ADDR: 'products:9090'
      USERS_SERVICE_ADDR: 'users:9091'
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      FRONTEND_ORIGIN: 'http://localhost:5173'
    ports:
      - '8000:8000'
    command: ["/app/bin/server"]

volumes:
  pgdata:
